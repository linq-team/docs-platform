packages:
  - apps/*
  - packages/*

catalog:
  '@astrojs/check': ^0.9.9
  '@astrojs/react': ^5.0.4
  '@astrojs/starlight': 0.39.2
  '@tsdown/css': ^0.22.0
  '@types/node': 24.12.2
  '@types/react': 19.2.14
  '@types/react-dom': ^19.2.3
  astro: ^6.3.1
  clsx: ^2.1.1
  dotenv: 17.4.2
  eslint: ^10.3.0
  lucide-react: ^1.14.0
  prettier: 3.8.3
  react: ^19.2.6
  react-dom: ^19.2.6
  shiki: ^4.0.2
  tsdown: ^0.22.0
  typescript: 6.0.3
  vite: ^7.3.2
  zod: ^4.4.3

hoistPattern:
  - vite
  - esbuild
  - '@astrojs/check'

hoistWorkspacePackages: false

packageExtensions:
  '@astrojs/react':
    peerDependencies:
      astro: '*'
  lucide-react:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

publicHoistPattern:
  - '*eslint*'
  - 'astro-expressive-code'

dedupePeers: true
